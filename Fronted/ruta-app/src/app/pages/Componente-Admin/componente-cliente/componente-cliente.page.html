<div class="admin-container">
  <!-- CABECERA DEL PANEL -->
  <div class="header-seccion">
    <h2>Gestión de Clientes</h2>
    <ion-button color="success" (click)="nuevocliente()">
      <ion-icon name="add-outline" slot="start"></ion-icon>
      Añadir Cliente
    </ion-button>
  </div>

  <div class="tabla-contenedor">
    <div class="tabla-clientes">
      <!-- CABECERA -->
      <div class="fila tabla-cabecera">
        <div class="col">Email</div>
        <div class="col">Nombre</div>
        <div class="col">Apellidos</div>
        <div class="col">Teléfono</div>
        <div class="col">Ubicación</div>
        <div class="col-acciones">Acciones</div>
      </div>

      <!-- FILAS -->
      <div class="fila tabla-fila" *ngFor="let c of clientes">
        <div class="col email-text">{{ c.email }}</div>
        <div class="col">{{ c.nombre }}</div>
        <div class="col">{{ c.apellido1 }} {{ c.apellido2 }}</div>
        <div class="col">{{ c.telefono }}</div>
        <div class="col">
          <small>{{ c.localidad }}, {{ c.provincia }}</small>
        </div>

        <div class="col-acciones">
          <ion-button fill="clear" color="warning" (click)="editarcliente(c.idCliente)">
            <ion-icon name="create-outline" slot="icon-only"></ion-icon>
          </ion-button>
          <ion-button fill="clear" color="danger" (click)="eliminarcliente(c.idCliente)">
            <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
          </ion-button>
        </div>
      </div>
    </div>
  </div>
</div>
