<ion-content class="pagina-admin">

  <div class="bloque-admin">

    <div class="bloque-header">
      <h2>Editar Cliente</h2>
    </div>

    <form [formGroup]="fg" class="formulario">

      <!-- EMAIL -->
      <div class="grupo">

        <label>Email</label>

        <div class="input-html">
          <input
            formControlName="email"
            type="email"
            placeholder="Correo electrónico">
        </div>

        <div
          class="error-texto"
          *ngIf="fg.get('email')?.touched && fg.get('email')?.errors">

          <p *ngIf="fg.get('email')?.hasError('emailInvalido')">
            Email inválido
          </p>

          <p *ngIf="fg.get('email')?.hasError('emailDuplicado')">
            Email ya en uso
          </p>

        </div>

      </div>

      <!-- DNI -->
      <div class="grupo">

        <label>DNI</label>

        <div class="input-html">
          <input
            formControlName="dni"
            type="text"
            placeholder="DNI">
        </div>

        <div
          class="error-texto"
          *ngIf="fg.get('dni')?.touched && fg.get('dni')?.errors">

          <p *ngIf="fg.get('dni')?.hasError('dniInvalido')">
            DNI incorrecto
          </p>

          <p *ngIf="fg.get('dni')?.hasError('dniDuplicado')">
            DNI ya registrado
          </p>

        </div>

      </div>

      <!-- PASSWORD -->
      <div class="grupo">

        <label>Contraseña</label>

        <div class="input-html">
          <input
            formControlName="password"
            type="password"
            placeholder="Nueva contraseña opcional">
        </div>

      </div>

      <!-- NOMBRE -->
      <div class="grupo">

        <label>Nombre</label>

        <div class="input-html">
          <input
            formControlName="nombre"
            type="text"
            placeholder="Nombre">
        </div>

        <div
          class="error-texto"
          *ngIf="fg.get('nombre')?.touched && fg.get('nombre')?.hasError('soloTexto')">

          <p>Solo letras permitidas</p>

        </div>

      </div>

      <!-- APELLIDO 1 -->
      <div class="grupo">

        <label>Apellido 1</label>

        <div class="input-html">
          <input
            formControlName="apellido1"
            type="text"
            placeholder="Primer apellido">
        </div>

        <div
          class="error-texto"
          *ngIf="fg.get('apellido1')?.touched && fg.get('apellido1')?.hasError('soloTexto')">

          <p>Solo letras permitidas</p>

        </div>

      </div>

      <!-- APELLIDO 2 -->
      <div class="grupo">

        <label>Apellido 2</label>

        <div class="input-html">
          <input
            formControlName="apellido2"
            type="text"
            placeholder="Segundo apellido">
        </div>

        <div
          class="error-texto"
          *ngIf="fg.get('apellido2')?.touched && fg.get('apellido2')?.hasError('soloTexto')">

          <p>Solo letras permitidas</p>

        </div>

      </div>

      <!-- TELEFONO -->
      <div class="grupo">

        <label>Teléfono</label>

        <div class="input-html">
          <input
            formControlName="telefono"
            type="tel"
            placeholder="Teléfono">
        </div>

        <div
          class="error-texto"
          *ngIf="fg.get('telefono')?.touched && fg.get('telefono')?.hasError('telefonoInvalido')">

          <p>Debe tener 9 dígitos</p>

        </div>

      </div>

      <!-- PROVINCIA -->
      <div class="grupo">

        <label>Provincia</label>

        <div class="select-html">

          <select
            formControlName="provincia"
            (change)="onProvinciaChange()">

            <option value="" disabled>
              Selecciona provincia
            </option>

            <option
              *ngFor="let p of provincias"
              [value]="p.CPRO">

              {{ p.PRO || p.NOMBRE_PROVINCIA }}

            </option>

          </select>

        </div>

      </div>

      <!-- LOCALIDAD -->
      <div class="grupo">

        <label>Localidad</label>

        <div class="select-html">

          <select formControlName="localidad">

            <option value="" disabled>
              Selecciona localidad
            </option>

            <option
              *ngFor="let l of localidades"
              [value]="l.DMUN50">

              {{ l.DMUN50 }}

            </option>

          </select>

        </div>

      </div>

      <!-- BOTÓN -->
      <ion-button
        expand="block"
        (click)="guardar()"
        [disabled]="fg.invalid">

        Actualizar

      </ion-button>

    </form>

  </div>

</ion-content>
