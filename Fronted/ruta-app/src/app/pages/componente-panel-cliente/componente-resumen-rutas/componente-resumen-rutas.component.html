<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/perfil"></ion-back-button>
    </ion-buttons>
    <ion-title>Mis Rutas Guardadas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="ion-padding">
    
    <div class="leyenda-container">
      <p><strong>Colores del trayecto:</strong></p>
      <div class="leyenda-items">
        <span class="item"><span class="dot azul"></span> Coche</span>
        <span class="item"><span class="dot verde"></span> Andando</span>
        <span class="item"><span class="dot naranja"></span> Bicicleta</span>
      </div>
    </div>

    <ion-list *ngIf="misRutas.length > 0; else noRutas">
      <ion-card *ngFor="let ruta of misRutas" class="ruta-card">
        <ion-card-header>
          <div class="header-flex">
            <ion-card-title>{{ ruta.titulo }}</ion-card-title>
            <ion-button fill="clear" color="danger" (click)="confirmarEliminar(ruta.id)">
              <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
            </ion-button>
          </div>
          <div class="header-flex">
            <ion-card-subtitle>
              <ion-icon name="time-outline"></ion-icon> {{ ruta.fechaCreacion | date:'dd/MM/yy HH:mm' }}
            </ion-card-subtitle>
            <ion-badge color="tertiary">ID: #{{ ruta.id }}</ion-badge>
          </div>
        </ion-card-header>

        <ion-card-content>
          <div class="resumen-texto">
            {{ ruta.descripcion }}
          </div>

          <div class="acciones-ruta">
            <ion-row>
              <ion-col size="4">
                <ion-button expand="block" fill="solid" color="primary" (click)="verRuta(ruta.id)">
                  <ion-icon slot="start" name="map-outline"></ion-icon>
                  Ver
                </ion-button>
              </ion-col>
              <ion-col size="4">
                <ion-button expand="block" fill="outline" color="success" (click)="publicarRuta(ruta)">
                  <ion-icon slot="start" name="share-social-outline"></ion-icon>
                  Publicar
                </ion-button>
              </ion-col>
              <ion-col size="4">
                <ion-button expand="block" fill="outline" color="warning" (click)="confirmarQuitarPublicacion(ruta)" [disabled]="!ruta.publicada">
                  <ion-icon slot="start" name="close-circle-outline"></ion-icon>
                  No publicar
                </ion-button>
              </ion-col>
            </ion-row>
          </div>
        </ion-card-content>
      </ion-card>
    </ion-list>

    <ng-template #noRutas>
      <div class="empty-state">
        <ion-icon name="trail-sign-outline"></ion-icon>
        <p>Todavía no has guardado ninguna ruta.</p>
      </div>
    </ng-template>
  </div>
</ion-content>
