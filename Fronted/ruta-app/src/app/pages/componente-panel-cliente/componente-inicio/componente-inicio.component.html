<div class="ion-padding">
  <div class="welcome-section" *ngIf="cliente">
    <h1>Bienvenido, {{cliente?.nombre}} 👤</h1> 
    <p>¿Qué planes tienes para hoy?</p>
  </div>

  <div *ngIf="!cliente" class="ion-text-center">
    <p>Cargando tus datos...</p>
  </div>

  <ion-grid>
    <ion-row>
      <ion-col size="12">
        <ion-card [routerLink]="['/componente-panel-cliente/mapa']" class="menu-card">
          <ion-card-header>
            <ion-card-title>Explorar Rutas</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            Calcula tu trayecto óptimo y añade paradas.
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="6">
        <ion-card [routerLink]="['../perfil']">
          <ion-card-content class="ion-text-center">
            <ion-icon name="person-circle-outline" size="large" color="primary"></ion-icon>
            <p>Mi Perfil</p>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="6">
        <ion-card [routerLink]="['../comunidad']">
          <ion-card-content class="ion-text-center">
            <ion-icon name="chatbubbles-outline" size="large" color="secondary"></ion-icon>
            <p>Comunidad</p>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</div>
