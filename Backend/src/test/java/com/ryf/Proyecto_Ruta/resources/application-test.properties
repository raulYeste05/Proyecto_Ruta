# Forzar base de datos H2 en memoria simulando MySQL
spring.datasource.url=jdbc:h2:mem:Proyecto_ruta;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialecto y estrategia de tablas para H2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.datasource.hikari.initializationFailTimeout=5000

# Evitar envíos de mail reales
spring.mail.host=localhost
spring.mail.port=25